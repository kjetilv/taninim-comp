# This workflow builds the composite with Maven.
#
# Two phases, and the order is required rather than preferred. Maven resolves build plugins
# before it builds anything, so uplift-maven-plugin has to be installed before taninim can
# start. See MAVEN-MIGRATION.md section 3.

name: Taninim

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # The build compiles with --enable-preview, and preview class files only run on the
      # exact same feature version, so this has to match the release the poms ask for.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # Phase 1. Installs the libraries and uplift-maven-plugin.
      - name: Build uplift
        run: mvn -B -f uplift/pom.xml install
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Phase 2. Resolves the plugin installed above.
      #
      # The native lambda build is skipped. It needs a docker daemon and several minutes
      # per lambda, and CI has no way to check the binary it produces. The CDK goals are
      # left out for the same reason, and because they would need AWS credentials.
      - name: Build taninim
        run: mvn -B -f taninim/pom.xml install -Duplift.skipNativeLambda=true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the hello-web example
        run: mvn -B -f uplift/examples/hello-web/pom.xml install -Duplift.skipNativeLambda=true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
